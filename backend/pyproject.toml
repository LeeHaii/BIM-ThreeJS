[project]
name = "bim-operations-api"
version = "0.1.0"
description = "Building-scoped operational API for the BIM platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["populate_m5new.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

